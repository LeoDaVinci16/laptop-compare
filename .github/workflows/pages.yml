# Builds the HTML report from data/ and publishes it on GitHub Pages
# every time you push to main (or when you click "Run workflow" in the Actions tab).
name: Publish report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]"
      - name: Test
        run: pytest -q
      - name: Check data
        run: laptop-compare --check
      - name: Build report
        run: |
          laptop-compare --out site --no-plots
          cp site/report.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
