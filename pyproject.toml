[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-compare"
version = "1.0.0"
description = "Compare laptops spec by spec against a base laptop: comparison CSV, charts and an HTML/Quarto report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "matplotlib>=3.7", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
laptop-compare = "laptop_compare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laptop_compare = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
